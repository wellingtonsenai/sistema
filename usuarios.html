<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Cantina MetalVale</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header class="topo">
        <h1 class="marca">Cantina <span>MetalVale</span></h1>
        <p class="slogan">Retirada de lanches sem ficha de papel</p>
        <nav id="menu" class="menu"></nav>
    </header>

    <main class="conteudo">
        <div class="painel">
            <section class="cartao">
                <h2>Cadastro de usuário</h2>
                <form onsubmit="salvar(); return false;">
                    <!-- vazio = usuário novo; com número = editando esse usuário -->
                    <input id="id" type="hidden">

                    <label for="matricula">Matrícula</label>
                    <input id="matricula" type="text" inputmode="numeric" required>

                    <label for="nome">Nome</label>
                    <input id="nome" type="text" required>

                    <label for="senha">Senha</label>
                    <input id="senha" type="password" placeholder="Ao editar, em branco mantém a atual">

                    <label for="perfil">Perfil</label>
                    <select id="perfil">
                        <option value="atendente">atendente</option>
                        <option value="supervisor">supervisor</option>
                    </select>

                    <button type="submit">Salvar</button>
                    <button type="button" class="secundario" onclick="limpar()">Limpar</button>
                </form>
                <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
            </section>

            <table>
                <thead>
                    <tr><th>Matrícula</th><th>Nome</th><th>Perfil</th><th>Ações</th></tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </div>
    </main>


    <script src="js/dados.js"></script>
    <script src="js/funcoes.js"></script>
    <script src="js/app.js"></script>

    <script>
    exigirSupervisor();

    let usuarios = [];

    // Desenha uma linha da tabela para cada usuário
    function mostrarUsuarios() {
        usuarios = listarUsuarios();
        let linhas = '';
        for (let i = 0; i < usuarios.length; i++) {
            let usuario = usuarios[i];
            linhas += '<tr>';
            linhas += '<td>' + usuario.matricula + '</td>';
            linhas += '<td>' + usuario.nome + '</td>';
            linhas += '<td>' + usuario.perfil + '</td>';
            linhas += '<td><button onclick="editar(' + i + ')">Editar</button> ';
            linhas += '<button class="excluir" onclick="excluir(' + i + ')">Excluir</button></td>';
            linhas += '</tr>';
        }
        document.getElementById('lista').innerHTML = linhas;
    }

    // Copia os dados do usuário para o formulário (a senha não vem na lista)
    function editar(i) {
        let usuario = usuarios[i];
        document.getElementById('id').value = usuario.id;
        document.getElementById('matricula').value = usuario.matricula;
        document.getElementById('nome').value = usuario.nome;
        document.getElementById('senha').value = '';
        document.getElementById('perfil').value = usuario.perfil;
        mostrarMensagem('Editando ' + usuario.nome, '');
    }

    function salvar() {
        let id = document.getElementById('id').value;
        let resultado = salvarUsuario({
            acao: id === '' ? 'inserir' : 'editar',
            id: id,
            matricula: document.getElementById('matricula').value,
            nome: document.getElementById('nome').value,
            senha: document.getElementById('senha').value,
            perfil: document.getElementById('perfil').value
        });
        if (resultado.erro) {
            mostrarMensagem(resultado.erro, 'erro');
            return;
        }
        limpar();
        mostrarMensagem('Usuário salvo!', 'sucesso');
        mostrarUsuarios();
    }

    function excluir(i) {
        if (!confirm('Excluir ' + usuarios[i].nome + '?')) return;
        excluirUsuario(usuarios[i].id);
        limpar();
        mostrarUsuarios();
    }

    function limpar() {
        document.querySelector('form').reset();
        document.getElementById('id').value = ''; // reset() não limpa campo hidden
        mostrarMensagem('', '');
    }

    mostrarUsuarios();
    </script>

    
</body>
</html>
