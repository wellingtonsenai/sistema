<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmas | Cantina MetalVale</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header class="topo">
        <h1 class="marca">Cantina <span>MetalVale</span></h1>
        <p class="slogan">Retirada de lanches sem ficha de papel</p>
        <nav id="menu" class="menu"></nav>
    </header>

    <main class="conteudo">
        <div class="painel">
            <section class="cartao">
                <h2>Cadastro de turma</h2>
                <form onsubmit="salvar(); return false;">
                    <!-- vazio = turma nova; com número = editando essa turma -->
                    <input id="id" type="hidden">

                    <label for="nome">Nome da turma</label>
                    <input id="nome" type="text" placeholder="Ex.: Desenvolvimento de Sistemas V1 22255" required>

                    <button type="submit">Salvar</button>
                    <button type="button" class="secundario" onclick="limpar()">Limpar</button>
                </form>
                <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
            </section>

            <table>
                <thead>
                    <tr><th>Turma</th><th>Alunos</th><th>Ações</th></tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </div>
    </main>


    <script src="js/dados.js"></script>
    <script src="js/funcoes.js"></script>
    <script src="js/app.js"></script>

    <script>
    exigirSupervisor();

    let turmas = [];

    // Desenha uma linha da tabela para cada turma
    function mostrarTurmas() {
        turmas = listarTurmas();
        let linhas = '';
        for (let i = 0; i < turmas.length; i++) {
            let turma = turmas[i];
            linhas += '<tr>';
            linhas += '<td>' + turma.nome + '</td>';
            linhas += '<td>' + turma.alunos + '</td>';
            linhas += '<td><button onclick="editar(' + i + ')">Editar</button> ';
            linhas += '<button class="excluir" onclick="excluir(' + i + ')">Excluir</button></td>';
            linhas += '</tr>';
        }
        document.getElementById('lista').innerHTML = linhas;
    }

    // Copia os dados da turma para o formulário
    function editar(i) {
        document.getElementById('id').value = turmas[i].id;
        document.getElementById('nome').value = turmas[i].nome;
        mostrarMensagem('Editando ' + turmas[i].nome, '');
    }

    function salvar() {
        let id = document.getElementById('id').value;
        let resultado = salvarTurma({
            acao: id === '' ? 'inserir' : 'editar',
            id: id,
            nome: document.getElementById('nome').value
        });
        if (resultado.erro) {
            mostrarMensagem(resultado.erro, 'erro');
            return;
        }
        limpar();
        mostrarMensagem('Turma salva!', 'sucesso');
        mostrarTurmas();
    }

    function excluir(i) {
        if (!confirm('Excluir a turma ' + turmas[i].nome + '?')) return;
        let resultado = excluirTurma(turmas[i].id);
        if (resultado.erro) {
            mostrarMensagem(resultado.erro, 'erro');
            return;
        }
        limpar();
        mostrarTurmas();
    }

    function limpar() {
        document.querySelector('form').reset();
        document.getElementById('id').value = ''; // reset() não limpa campo hidden
        mostrarMensagem('', '');
    }

    mostrarTurmas();
    </script>

</body>
</html>
