<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos | Cantina MetalVale</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header class="topo">
        <h1 class="marca">Cantina <span>MetalVale</span></h1>
        <p class="slogan">Retirada de lanches sem ficha de papel</p>
        <nav id="menu" class="menu"></nav>
    </header>

    <main class="conteudo">
        <div class="painel">
            <section class="cartao">
                <h2>Cadastro de aluno</h2>
                <form onsubmit="salvar(); return false;">
                    <!-- vazio = aluno novo; com número = editando esse aluno -->
                    <input id="id" type="hidden">

                    <label for="matricula">Matrícula</label>
                    <input id="matricula" type="text" required>

                    <label for="nome">Nome</label>
                    <input id="nome" type="text" required>

                    <label for="turma">Turma</label>
                    <select id="turma" required>
                        <option value="">Selecione a turma</option>
                    </select>

                    <label for="ativo">Ativo</label>
                    <select id="ativo">
                        <option value="1">sim</option>
                        <option value="0">não</option>
                    </select>

                    <button type="submit">Salvar</button>
                    <button type="button" class="secundario" onclick="limpar()">Limpar</button>
                </form>
                <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
            </section>

            <table>
                <thead>
                    <tr><th>Matrícula</th><th>Nome</th><th>Turma</th><th>Ações</th></tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </div>
    </main>


    <script src="js/dados.js"></script>
    <script src="js/funcoes.js"></script>
    <script src="js/app.js"></script>

    <script>
    exigirSupervisor();

    let alunos = [];

    // Coloca as turmas no select (uma vez, quando a página abre)
    let turmas = listarTurmas();
    for (let i = 0; i < turmas.length; i++) {
        document.getElementById('turma').innerHTML += '<option value="' + turmas[i].id + '">' + turmas[i].nome + '</option>';
    }

    // Desenha uma linha da tabela para cada aluno
    function mostrarAlunos() {
        alunos = listarAlunos();
        let linhas = '';
        for (let i = 0; i < alunos.length; i++) {
            let aluno = alunos[i];
            linhas += '<tr>';
            linhas += '<td>' + aluno.matricula + '</td>';
            linhas += '<td>' + aluno.nome + '</td>';
            linhas += '<td>' + aluno.turma + '</td>';
            linhas += '<td><button onclick="editar(' + i + ')">Editar</button> ';
            linhas += '<button class="excluir" onclick="excluir(' + i + ')">Excluir</button></td>';
            linhas += '</tr>';
        }
        document.getElementById('lista').innerHTML = linhas;
    }

    // Copia os dados do aluno para o formulário
    function editar(i) {
        let aluno = alunos[i];
        document.getElementById('id').value = aluno.id;
        document.getElementById('matricula').value = aluno.matricula;
        document.getElementById('nome').value = aluno.nome;
        document.getElementById('turma').value = aluno.turma_id;
        document.getElementById('ativo').value = aluno.ativo;
        mostrarMensagem('Editando ' + aluno.nome, '');
    }

    function salvar() {
        let id = document.getElementById('id').value;
        let resultado = salvarAluno({
            acao: id === '' ? 'inserir' : 'editar',
            id: id,
            matricula: document.getElementById('matricula').value,
            nome: document.getElementById('nome').value,
            turma_id: document.getElementById('turma').value,
            ativo: document.getElementById('ativo').value
        });
        if (resultado.erro) {
            mostrarMensagem(resultado.erro, 'erro');
            return;
        }
        limpar();
        mostrarMensagem('Aluno salvo!', 'sucesso');
        mostrarAlunos();
    }

    function excluir(i) {
        if (!confirm('Excluir ' + alunos[i].nome + '?')) return;
        let resultado = excluirAluno(alunos[i].id);
        if (resultado.erro) {
            mostrarMensagem(resultado.erro, 'erro');
            return;
        }
        limpar();
        mostrarAlunos();
    }

    function limpar() {
        document.querySelector('form').reset();
        document.getElementById('id').value = ''; // reset() não limpa campo hidden
        mostrarMensagem('', '');
    }

    mostrarAlunos();
    </script>

</body>
</html>
